name: Official OpenAPI drift review
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test drift checker
        run: python3 -m unittest discover -s tests/upstream -v
      - name: Compare official upstream without modifying the pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/compare-upstream.py --fetch --fail-on-drift
      - name: Preserve review report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-openapi-drift
          path: artifacts/upstream-drift/
          if-no-files-found: warn
