name: SDK validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  KIRORA_RUN_INTEGRATION: '0'
  KIRORA_RUN_SMOKE: '0'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generated source and pinned contract checks
        run: |
          python tools/generate-foundation-models.py --check
          python tools/generate-core.py --check
          python tools/generate-core-fixtures.py --check
          python tools/generate-endpoint-invoker.py --check
          python tools/generate-coverage.py --check
      - run: dotnet restore --locked-mode
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=ci.trx"
      - name: Public API compatibility
        run: python tools/check-public-api.py
      - name: Package and symbols
        run: dotnet pack --configuration Release --no-build
      - name: Validate local package metadata
        run: python tools/validate-package.py
      - name: Embedded SourceLink and independent package consumer
        run: |
          python tools/check-sourcelink.py
          python tools/check-package-consumer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            src/Kirora/bin/Release/*.nupkg
            src/Kirora/bin/Release/*.snupkg
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: dotnet restore --locked-mode
      - run: python tools/check-dependencies.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit
          path: artifacts/dependency-audit.json
  native-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: dotnet publish examples/Kirora.NativeAotSmoke --configuration Release --runtime linux-x64 -p:PublishAot=true -p:TrimmerSingleWarn=false -p:EnableTrimAnalyzer=true -p:EnableAotAnalyzer=true --output artifacts/aot
      - run: artifacts/aot/Kirora.NativeAotSmoke --require-native
